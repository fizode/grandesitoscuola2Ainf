<!DOCTYPE html>
<html>
    <head>
        <title>Pantera</title>
        <!-- <link rel="stylesheet" href="style.css"> -->
        <style>

            #back{
                background-color: rgb(255, 255, 255);
                color: rgb(0, 0, 0);
                padding: 0.3%;
                border-radius: 10px;
                font-weight: bold;
                border: 3px solid rgb(0, 0, 0);
                transition: all 0.5s;
                text-decoration: none;
                font-size: 180%;
                display: flex;
                float: left;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }
            #back:hover {
                transform: scale(1.10);
                background-color: rgb(0, 0, 0);
                color: rgb(255, 255, 255);
            }
            h1{
                width: 90%; 
                max-width: 500px; 
                margin: 0 auto; 
                margin-top: 1%;
                font-size: 300%;
                text-align: center;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                padding: 10px;
                border: 3px solid rgb(0, 0, 0);
                border-radius: 13px;
                
                background-color: rgb(190, 10, 10); 
                color: rgb(255, 255, 255);
                text-shadow:
                    -3px -3px 0 rgb(0, 0, 0),
                     3px -3px 0 rgb(0, 0, 0),
                    -3px  3px 0 rgb(0, 0, 0),
                     3px  3px 0 rgb(0, 0, 0);
            }
            body{
                background-color: rgb(13, 115, 170);
            }
            #sottotitolo{
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                font-size: 20px;
                color: rgb(0, 0, 0);
                text-align: center;
                width: 85%;
                margin: 20px auto;
                padding: 10px;
                border: 2px solid rgb(11, 197, 24);
                border-radius: 10px;
                background-color: rgb(11, 197, 24);
                box-shadow: 0px 5px 35px rgba(255, 255, 3, 0.489)
            }
            #immagini1{
                padding: 10px;
                display: flex;
                justify-content: center;
                margin: 0 auto;
                height: 1%;
                width: 90%;   
            }
            #pic1{
                width: 50%;
                margin-right: 2%;
                border-radius: 13px;
                border: 3px solid rgb(0, 0, 0);
            }
            #pic2{
                width: 50%;
                margin-left: 2%;
                border-radius: 13px;
                border: 3px solid rgb(0, 0, 0);
            }
            #immagini2{
                padding: 10px;
                display: flex;
                justify-content: center;
                margin: 0 auto;
                height: 1%;
                width: 90%;   
            }
            #pic3{
                width: 50%;
                margin-right: 2%;
                border: 3px solid rgb(0, 0, 0);
                border-radius: 13px;
            }
            #pic4{
                width: 50%;
                margin-left: 2%;
                border: 3px solid rgb(0, 0, 0);
                border-radius: 13px;
            }
            #descrizione{
                text-align: center;
                border: 3px solid rgb(0, 0, 0);
                border-radius: 13px;
                background-color:rgb(11, 197, 24);
                border-color: rgb(11, 197, 24);
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                font-size: 20px;
                padding: 10px;
                margin: 20px auto;
                width: 85%;
            }
            ul{
              list-style-position: inside;
              padding-left: 0;
              margin-left: 0;
            }
            hr{
                width: 85%;
                border: 1px solid rgb(0, 0, 0);
                background-color: rgb(0, 0, 0);
            }
        </style>
    </head>

    <body>

        <a id="back" href="index.html">
            Indietro
        </a>

        <h1>
            Pantera
        </h1>

        
        <p id="sottotitolo">
            SCRIVERE QUALCOSA SUI PANTERA <br> 
        </p>

        <div id="immagini1">
            <img id="pic1" alt="NOME IMMAGINE" src="../media/images/music/pantera/IMMAGINE">
            <img id="pic2" alt="NOME IMMAGINE" src="../media/images/music/pantera/IMMAGINE">
        </div>

        <div id="immagini2">
            <img id="pic3" alt="NOME IMMAGINE" src="../media/images/music/pantera/IMMAGINE">
            <img id="pic4" alt="NOME IMMAGINE" src="../media/images/music/pantera/IMMAGINE">
        </div>
        <div id="descrizione">
            <p>
                <b>DESCRIZIONE<br>
                <hr>
                <b>ALBUM (?)</b>
                <ul>
                    <li>ALBUM1</li>
                    <li>ALBUM2</li>
                    <li>ALBUM3</li>
                    <li>ALBUM4</li>
                </ul>
                <hr>
                <b>DESCRIZIONE</b> <br>
                DESCRIZIONE
            </p>
        </div>
    </body>
    </html>
